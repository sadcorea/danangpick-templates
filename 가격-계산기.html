<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>다낭픽 가격 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pricing/pricing-calc.css">
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="header-logo">DanangPick</div>
      <div class="header-sub">Da Nang Night Selection</div>
    </div>
    <div class="header-divider"></div>
    <div class="header-title">가격<br>계 산 기</div>
  </div>

  <div class="nav-bar">
    <a href="가격-시뮬레이터.html" class="nav-link">시뮬레이터</a>
    <a href="가격-계산기.html" class="nav-link active">계산기</a>
  </div>

  <div class="settings-bar">
    <label>환율</label>
    <span>1,000,000 VND =</span>
    <input type="number" id="rate-input" value="55000" oninput="onRateChange(this)">
    <span>원</span>
    <span class="spacer"></span>
    <button class="btn-json" onclick="exportJSON()">JSON 내보내기</button>
    <button class="btn-json import" onclick="importJSON()">JSON 불러오기</button>
    <button class="btn-export" onclick="exportTxt()">메모장 저장</button>
    <button class="btn-confirm" onclick="confirmCost()">원가 확정</button>
    <button class="btn-reset" onclick="resetCalc()">초기화</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>품목</th>
          <th>원가 (동)</th>
          <th>마진 (동)</th>
          <th>판매가</th>
          <th>마진율</th>
        </tr>
      </thead>
      <tbody id="calc-body"></tbody>
    </table>
  </div>

  <script src="pricing/pricing-data.js"></script>
  <script src="pricing/pricing-calc.js"></script>

</body>
</html>
