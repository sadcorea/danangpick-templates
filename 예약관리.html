<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>다낭픽 예약관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .header { justify-content: center; }

    /* 탭바 */
    .booking-tabs {
      position: sticky;
      top: 104px;
      z-index: 99;
      background: rgba(12,12,12,0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
    }
    .booking-tabs .tab-btn { flex: 1; text-align: center; }

    /* 패널 */
    .panel { display: none; padding: 20px 14px 48px; max-width: 640px; margin: 0 auto; }
    .panel.active { display: block; }

    /* 폼 */
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; font-size: 11px; color: var(--gold-dark);
      letter-spacing: 0.1em; margin-bottom: 6px; font-weight: 500;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; padding: 12px 14px; outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-select { appearance: none; cursor: pointer; }
    .form-textarea { resize: vertical; min-height: 60px; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    /* 예약 등록 버튼 */
    .booking-submit-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none; border-radius: 8px; color: #fff;
      font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 16px; transition: transform 0.1s;
    }
    .booking-submit-btn:active { transform: scale(0.97); }
    .booking-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .booking-product-tag {
      display: inline-block; background: rgba(201,162,74,0.12);
      border: 1px solid rgba(201,162,74,0.3); border-radius: 6px;
      padding: 6px 10px; font-size: 13px; color: var(--gold-light);
      margin: 0 4px 4px 0;
    }

    .grab-radio-group { display: flex; gap: 16px; padding-top: 4px; }
    .grab-radio-group label {
      display: flex; align-items: center; gap: 6px;
      font-size: 14px; color: var(--text); cursor: pointer;
    }
    .grab-radio-group input[type="radio"] { accent-color: var(--gold); }

    /* 예약 성공 모달 */
    .booking-modal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .booking-modal.active { display: flex; }
    .booking-modal-content {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center;
    }
    .booking-modal-title { font-size: 18px; font-weight: 700; color: #48bb78; margin-bottom: 16px; }
    .booking-modal-info {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin: 16px 0; text-align: left; font-size: 13px;
    }
    .booking-modal-info p { margin: 6px 0; color: var(--text-muted); }
    .booking-modal-info strong { color: var(--text); }
    .booking-modal-message {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px; margin: 12px 0;
      white-space: pre-wrap; font-family: monospace; font-size: 12px;
      line-height: 1.6; text-align: left; color: var(--text);
      max-height: 200px; overflow-y: auto;
    }
    .booking-modal-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-family: 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: transform 0.1s;
    }
    .booking-modal-btn:active { transform: scale(0.97); }
    .booking-modal-btn.primary { background: var(--gold-grad); color: #111; }
    .booking-modal-btn.kakao { background: #fee500; color: #000; }
    .booking-modal-btn.secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }

    /* ── 예약 관리 탭 ── */
    .filter-bar {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; padding: 7px 14px;
      border: 1px solid var(--border); border-radius: 20px;
      background: none; color: var(--text-muted); font-size: 12px;
      font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
      white-space: nowrap; transition: all 0.2s;
    }
    .filter-chip.active { border-color: var(--gold); color: var(--gold); background: rgba(201,162,74,0.08); }

    .search-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 12px;
    }
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--text-muted); }

    /* 예약 카드 */
    .bk-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .bk-card:hover { border-color: var(--border-hover); }
    .bk-card-header {
      padding: 12px 16px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .bk-card-left { display: flex; flex-direction: column; gap: 2px; }
    .bk-card-number { font-size: 12px; color: var(--text-muted); }
    .bk-card-partner { font-size: 14px; font-weight: 700; }
    .bk-card-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .bk-badge {
      font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 500;
    }
    .bk-badge-대기 { border: 1px solid #f6ad55; color: #f6ad55; }
    .bk-badge-확정 { border: 1px solid #48bb78; color: #48bb78; }
    .bk-badge-완료 { border: 1px solid #4299e1; color: #4299e1; }
    .bk-badge-취소 { border: 1px solid #fc8181; color: #fc8181; }
    .bk-card-body {
      display: none; padding: 0 16px 16px; border-top: 1px solid var(--border);
    }
    .bk-card.open .bk-card-body { display: block; }
    .bk-info-row {
      display: flex; padding: 6px 0; font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .bk-info-label { width: 80px; flex-shrink: 0; color: var(--text-muted); font-size: 12px; }
    .bk-info-value { flex: 1; color: var(--text); }
    .bk-actions { display: flex; gap: 8px; margin-top: 12px; }
    .bk-action-btn {
      flex: 1; padding: 10px; border-radius: 6px;
      font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; border: none;
    }
    .bk-btn-confirm { background: rgba(72,187,120,0.15); color: #48bb78; }
    .bk-btn-confirm:hover { background: rgba(72,187,120,0.3); }
    .bk-btn-complete { background: rgba(66,153,225,0.15); color: #4299e1; }
    .bk-btn-complete:hover { background: rgba(66,153,225,0.3); }
    .bk-btn-cancel { background: rgba(252,129,129,0.1); color: #fc8181; }
    .bk-btn-cancel:hover { background: rgba(252,129,129,0.2); }
    .bk-btn-copy { background: rgba(201,162,74,0.12); color: var(--gold); }
    .bk-btn-copy:hover { background: rgba(201,162,74,0.2); }
    .bk-btn-copy.copied { background: var(--gold-dark); color: #111; }
    .bk-empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
    .bk-count { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .bk-count strong { color: var(--gold); }
    .bk-loading { text-align: center; color: var(--text-muted); padding: 40px 0; }

    /* ── 대시보드 탭 ── */
    .dash-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .dash-card-title { font-size: 12px; color: var(--gold-dark); letter-spacing: 0.1em; font-weight: 500; margin-bottom: 10px; }
    .dash-stat-row { display: flex; justify-content: space-between; gap: 8px; }
    .dash-stat {
      flex: 1; text-align: center; padding: 12px 8px;
      background: rgba(255,255,255,0.03); border-radius: 8px;
    }
    .dash-stat-num { font-size: 22px; font-weight: 700; color: var(--gold-light); }
    .dash-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .dash-today-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px;
    }
    .dash-today-item:last-child { border-bottom: none; }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--gold-dark); color: #111; font-weight: 700;
      padding: 12px 24px; border-radius: 8px; font-size: 14px;
      z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="header-logo">DanangPick</div>
      <div class="header-sub">Reservation Management</div>
    </div>
  </div>

  <nav class="page-nav">
    <a href="index.html" class="page-nav-btn">고객응대</a>
    <a href="%EC%97%85%EC%B2%B4%EA%B4%80%EB%A6%AC.html" class="page-nav-btn">업체관리</a>
    <a href="%EC%98%88%EC%95%BD%EA%B4%80%EB%A6%AC.html" class="page-nav-btn active">예약관리</a>
  </nav>

  <div class="booking-tabs">
    <button class="tab-btn active" data-tab="register">예약 등록</button>
    <button class="tab-btn" data-tab="manage">예약 관리</button>
    <button class="tab-btn" data-tab="dashboard">대시보드</button>
  </div>

  <!-- ━━ 탭1: 예약 등록 ━━ -->
  <div id="panel-register" class="panel active">
    <div class="form-group">
      <label class="form-label">카테고리 *</label>
      <select id="b-category" class="form-select"><option value="">선택하세요</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">업체명 *</label>
      <select id="b-partner" class="form-select"><option value="">카테고리를 먼저 선택</option></select>
    </div>
    <div class="form-group">
      <label class="form-label">상품명/옵션 *</label>
      <input type="text" id="b-product" class="form-input" placeholder="예: 90분 타이마사지 x2">
    </div>
    <div id="b-product-tags" style="margin-top:-8px;margin-bottom:12px;"></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">예약일 *</label>
        <input type="date" id="b-date" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">예약시간 *</label>
        <input type="time" id="b-time" class="form-input" required step="1800">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">인원 *</label>
        <input type="number" id="b-persons" class="form-input" min="1" value="1" required>
      </div>
      <div class="form-group">
        <label class="form-label">그랩 제공 *</label>
        <div class="grab-radio-group">
          <label><input type="radio" name="b-grab" value="예" checked> 예</label>
          <label><input type="radio" name="b-grab" value="아니오"> 아니오</label>
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">고객명</label>
        <input type="text" id="b-customer" class="form-input" placeholder="선택사항">
      </div>
      <div class="form-group">
        <label class="form-label">연락처</label>
        <input type="tel" id="b-phone" class="form-input" placeholder="선택사항">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">요청사항</label>
      <textarea id="b-request" class="form-textarea" placeholder="고객 요청사항"></textarea>
    </div>
    <button type="button" class="booking-submit-btn" id="b-submit-btn">📅 예약 등록</button>
  </div>

  <!-- ━━ 탭2: 예약 관리 ━━ -->
  <div id="panel-manage" class="panel">
    <input type="text" class="search-input" id="bk-search" placeholder="🔍 예약번호 / 고객명 / 업체명 검색...">
    <div class="filter-bar" id="bk-status-filter"></div>
    <div class="filter-bar" id="bk-period-filter" style="margin-top:4px;"></div>
    <div class="bk-count" id="bk-count"></div>
    <div id="bk-list"></div>
  </div>

  <!-- ━━ 탭3: 대시보드 ━━ -->
  <div id="panel-dashboard" class="panel">
    <div class="dash-card">
      <div class="dash-card-title">오늘 예약 현황</div>
      <div class="dash-stat-row" id="dash-today-stats"></div>
    </div>
    <div class="dash-card">
      <div class="dash-card-title">이번 달 요약</div>
      <div class="dash-stat-row" id="dash-month-stats"></div>
    </div>
    <div class="dash-card">
      <div class="dash-card-title">오늘 예약 목록</div>
      <div id="dash-today-list"></div>
    </div>
  </div>

  <!-- 예약 성공 모달 -->
  <div class="booking-modal" id="bookingModal">
    <div class="booking-modal-content">
      <div class="booking-modal-title">✅ 예약 등록 완료!</div>
      <div class="booking-modal-info">
        <p><strong>예약번호:</strong> <span id="bm-number"></span></p>
        <p><strong>업체:</strong> <span id="bm-partner"></span></p>
      </div>
      <div class="booking-modal-message" id="bm-message"></div>
      <button class="booking-modal-btn primary" id="bm-copy-btn">📋 메시지 복사</button>
      <button class="booking-modal-btn kakao" id="bm-kakao-btn" style="display:none;">💬 업체 카톡 바로가기</button>
      <button class="booking-modal-btn secondary" id="bm-close-btn">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/vendor-data.js"></script>
  <script src="js/booking-app.js"></script>
</body>
</html>
