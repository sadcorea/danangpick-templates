<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>다낭픽 가격 시뮬레이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pricing/pricing-style.css">
</head>
<body>

  <div class="header">
    <div class="header-brand">
      <div class="header-logo">DanangPick</div>
      <div class="header-sub">Da Nang Night Selection</div>
    </div>
    <div class="header-divider"></div>
    <div class="header-title">가격<br>시뮬레이터</div>
  </div>

  <div style="display:flex;justify-content:center;gap:10px;padding:12px 14px;">
    <a href="가격-시뮬레이터.html" style="padding:8px 18px;border:1px solid rgba(201,162,74,0.5);border-radius:10px;font-size:12px;color:#F0D77B;text-decoration:none;background:rgba(201,162,74,0.08);">시뮬레이터</a>
    <a href="가격-계산기.html" style="padding:8px 18px;border:1px solid rgba(201,162,74,0.18);border-radius:10px;font-size:12px;color:#7a7060;text-decoration:none;">계산기</a>
  </div>

  <div id="tab-bar" class="tab-bar"></div>

  <div style="padding: 16px 14px 0; max-width: 720px; margin: 0 auto;">
    <div class="rate-bar">
      <label>환율</label>
      <span>1,000,000 VND =</span>
      <input type="number" id="rate-input" value="55000" oninput="onRateChange(this)">
      <span>원</span>
      <span style="flex:1"></span>
      <button class="action-btn json-export" onclick="exportJSON()">JSON 내보내기</button>
      <button class="action-btn json-import" onclick="importJSON()">JSON 불러오기</button>
      <button class="action-btn export" onclick="exportTxt()">메모장 저장</button>
      <button class="action-btn confirm" onclick="confirmSell()">판매가 확정</button>
      <button class="action-btn reset" onclick="resetAll()">초기화</button>
    </div>
  </div>

  <div id="content" class="content"></div>

  <script src="pricing/pricing-data.js"></script>
  <script src="pricing/pricing-app.js"></script>

</body>
</html>
